<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Collection</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>My Game Collection</h1>
    <p>Add a game to your list.</p>
    <label for="gameInput">Game title</label>
    <div class="controls">
      <input id="gameInput" type="text" placeholder="Type a game title">
      <button id="addButton" type="button">Add Game</button>
    </div>
    <p id="message" role="status"></p>
    <h2>Games</h2>
    <div id="gameList"></div>
    <p id="count"></p>
  </main>
</body>
</html>
